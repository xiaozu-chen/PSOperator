[package]
name = "psoperator"
version = "0.2.0"
description = "PSOperator - a PowerShell wrapper in the style of the Claude Code CLI"
edition = "2021"

[lib]
name = "psoperator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 8
lto = "thin"
opt-level = "s"
strip = true
